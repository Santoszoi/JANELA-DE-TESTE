<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Exercício de modal acessível com confirmação de ação."><title>Accessible Dialog UI</title><link rel="stylesheet" href="style.css"></head><body><main><section class="card"><p class="eyebrow">Interaction pattern</p><h1>Confirmação sem surpresa.</h1><p>Exemplo de diálogo para uma ação importante, com foco, cancelamento e retorno claro ao usuário.</p><button class="primary" id="open">Remover item</button><p id="status" class="status" aria-live="polite"></p></section></main><div class="backdrop" id="backdrop" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-copy"><button class="close" id="close" aria-label="Fechar diálogo">×</button><p class="eyebrow">Confirmar ação</p><h2 id="dialog-title">Remover este item?</h2><p id="dialog-copy">Esta demonstração simula uma ação destrutiva. Você ainda pode cancelar.</p><div class="actions"><button id="cancel">Cancelar</button><button class="danger" id="confirm">Sim, remover</button></div></section></div><script src="script.js"></script></body></html>
